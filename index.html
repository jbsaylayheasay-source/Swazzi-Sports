.sub{margin:0 0 16px;font-size:14px}
.story{padding:14px 0;border-top:1px solid var(--line)}
.story:first-of-type{border-top:2px solid var(--ink)}
.tag{font-size:13px;font-weight:700;color:var(--red)}
.story summary{cursor:pointer;list-style:none}.story summary::-webkit-details-marker{display:none}
.story h3{margin:2px 0 4px;font-size:19px;line-height:1.25}
.story p{margin:0 0 10px;color:var(--muted)}.story .body p{color:var(--ink)}
.meta{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.sc{font-family:var(--display);font-size:24px;color:var(--green);white-space:nowrap}
.why{font-size:14px;color:var(--muted);margin:8px 0 0}
.tools{display:flex;gap:6px;margin-top:8px}
.empty{color:var(--muted);padding:12px 0}
footer{border-top:2px solid var(--ink);padding:20px 0 30px;color:var(--muted);font-size:14px}
